<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1210">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mesa">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Mesa</title>
</head>
<body>
  <div class="app">
    <header>
      <strong>Mesa</strong>
      <span id="meta"></span>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" class="on" data-tab="fila" aria-selected="true">Fila</button>
      <button type="button" data-tab="frota" aria-selected="false">Frota</button>
    </nav>
    <main>
      <section id="fila"></section>
      <section id="frota" hidden></section>
    </main>
  </div>
  <dialog id="dlg">
    <form method="dialog">
      <p id="dlg-title"></p>
      <textarea id="dlg-text" readonly rows="3"></textarea>
      <div class="dlg-actions">
        <button type="button" id="dlg-copy">Copiar</button>
        <a id="dlg-open">Abrir Maestro</a>
        <button value="cancel">Fechar</button>
      </div>
      <p id="dlg-status" aria-live="polite"></p>
    </form>
  </dialog>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
